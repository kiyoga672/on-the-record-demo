version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --no-fund
    build:
      commands:
        - node scripts/write-runtime-env.mjs
        - npm test
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
